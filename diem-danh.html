<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Điểm danh • Our Stage</title><link rel="icon" href="/favicon.png"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 20% 0,#f3dde4,transparent 35%),#f7f2f4;color:#28181e;min-height:100vh;padding:28px}.wrap{width:min(650px,100%);margin:auto}.brand{display:flex;gap:10px;align-items:center;margin-bottom:16px}.brand img{width:58px;height:58px;object-fit:contain;border-radius:12px}.brand b{letter-spacing:.22em}.card{background:#fff;border:1px solid #eadce1;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(75,20,39,.1)}h1{margin:4px 0 7px;font-size:27px}.muted{color:#7d6f74;line-height:1.5}.field{margin-top:13px}.field label{display:block;font-size:11px;font-weight:850;margin-bottom:6px}.field input{width:100%;padding:13px 14px;border:1px solid #d9ced2;border-radius:11px;font:inherit}.field input:focus{outline:none;border-color:#9c4d64;box-shadow:0 0 0 4px rgba(112,23,45,.09)}button{margin-top:15px;width:100%;border:0;border-radius:11px;padding:13px;background:linear-gradient(135deg,#7c1833,#541021);color:#fff;font-weight:850;cursor:pointer}.state{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f8f3f5;font-size:12px}.state.error{background:#fff0f2;color:#a1243e}.hidden{display:none!important}</style></head><body><div class="wrap"><div class="brand"><img src="/logo.png" alt="Our Stage Club"><b>OUR STAGE</b></div><div class="card"><div style="font-size:10px;font-weight:900;letter-spacing:.14em;color:#8a6d77">QR ĐIỂM DANH</div><h1 id="title">Đang tải…</h1><p id="instruction" class="muted">Vui lòng chờ.</p><div id="form" class="hidden"><div class="field"><label>MSSV</label><input id="mssv" autocomplete="off" maxlength="50" placeholder="Nhập MSSV"></div><div class="field"><label>Họ và tên</label><input id="name" autocomplete="name" maxlength="120" placeholder="Nhập họ và tên"></div><button id="submit">Gửi điểm danh</button></div><div id="state" class="state">Đang kiểm tra QR…</div></div></div><script>const firebaseConfig={apiKey:"AIzaSyDwVHk4sYnjcEST2VQmnQlbGQV-fqromNM",authDomain:"clb-our.firebaseapp.com",projectId:"clb-our",storageBucket:"clb-our.firebasestorage.app",messagingSenderId:"390807081243",appId:"1:390807081243:web:7e8f45f2783c01bf0403be"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),$=s=>document.querySelector(s),token=new URLSearchParams(location.search).get("token");let portal=null;function st(t,e=false){$("#state").textContent=t;$("#state").classList.toggle("error",e)}async function init(){if(!token)return st("Link QR không hợp lệ.",true);try{const s=await db.collection("attendancePortals").doc(token).get();if(!s.exists)throw new Error("QR không tồn tại.");portal=s.data();const now=new Date(),start=portal.startAt?.toDate(),end=portal.endAt?.toDate();if(portal.open!==true)throw new Error("QR đã đóng.");if(start&&now<start)throw new Error("Chưa đến thời gian điểm danh.");if(end&&now>end)throw new Error("QR đã hết hạn.");$("#title").textContent=portal.itemName||"Điểm danh";$("#instruction").textContent=portal.instruction||"Nhập thông tin để gửi điểm danh.";$("#form").classList.remove("hidden");st("Thông tin sẽ chờ BTC duyệt trước khi tính điểm.")}catch(e){st(e.message||"Không mở được QR.",true)}}$("#submit").onclick=async()=>{const mssv=$("#mssv").value.trim(),name=$("#name").value.trim();if(!mssv||!name)return st("Vui lòng nhập MSSV và họ tên.",true);$("#submit").disabled=true;try{const id=btoa(unescape(encodeURIComponent(mssv.toUpperCase()))).replace(/[^A-Za-z0-9_-]/g,"").slice(0,100)||Date.now().toString();await db.collection("attendancePortals").doc(token).collection("checkins").doc(id).set({mssv,name,status:"pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:false});$("#form").classList.add("hidden");st("Đã gửi điểm danh. Vui lòng chờ BTC duyệt.")}catch(e){st("Không gửi được. Có thể MSSV này đã điểm danh hoặc QR đã đóng.",true)}finally{$("#submit").disabled=false}};init();</script></body></html>
