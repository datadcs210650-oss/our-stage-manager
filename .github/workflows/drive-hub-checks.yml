name: OSC Drive Hub checks
on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  drive-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check lib/osc-drive.js
          node --check lib/drive-hub-handler.js
          node --check lib/drive-oauth-handler.js
          node --check drive-hub.js
      - name: Full JavaScript syntax check (all app entrypoints)
        run: |
          find api lib -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Regression tests
        run: node --test tests/*.test.js
      - name: Dependency vulnerability audit (high and critical)
        run: npm audit --omit=dev --audit-level=high
