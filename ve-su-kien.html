<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Nhận vé sự kiện • Our Stage</title>
<link rel="icon" href="/favicon.png">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#18222b;--muted:#6c7780;--line:#e7e9ec;--wine:#8d2949;--wine2:#b44769;--bg:#f5f6f8;--ok:#117a55;--bad:#a22b3d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 0%,rgba(180,71,105,.10),transparent 30%),var(--bg)}
body{padding:28px 16px 48px}.shell{width:min(960px,100%);margin:auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:14px;padding:3px;box-shadow:0 8px 24px rgba(31,39,46,.08)}.brand b{font-size:18px;letter-spacing:-.3px}.brand small{display:block;color:var(--muted);margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(27,36,43,.08);overflow:hidden}.hero{padding:26px 26px 18px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fff,#fff8fb)}.eyebrow{font-size:11px;letter-spacing:1.7px;font-weight:900;color:var(--wine);text-transform:uppercase}.hero h1{font-size:28px;margin:7px 0 7px;letter-spacing:-.7px}.hero p{margin:0;color:var(--muted);line-height:1.55}.lookup{padding:22px 26px;display:grid;grid-template-columns:1fr auto;gap:10px}.lookup input{width:100%;height:48px;border:1px solid #dadddf;border-radius:13px;padding:0 15px;font-size:16px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;outline:none}.lookup input:focus{border-color:#c26683;box-shadow:0 0 0 4px rgba(180,71,105,.10)}button{border:0;border-radius:13px;padding:0 20px;height:48px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff;box-shadow:0 10px 24px rgba(141,41,73,.18)}button:disabled{opacity:.55;cursor:not-allowed}.status{margin:0 26px 22px;padding:13px 15px;border-radius:13px;background:#f4f6f7;color:#53606a;line-height:1.45}.status.ok{background:#edf9f4;color:#116747}.status.error{background:#fff0f2;color:#8d2638}.ticket-area{padding:0 26px 26px}.ticket-wrap{background:#eef0f2;border-radius:18px;padding:14px;overflow:auto}.ticket-wrap canvas{display:block;max-width:100%;height:auto;margin:auto;border-radius:10px;box-shadow:0 10px 32px rgba(20,27,32,.14);background:#fff}.ticket-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.chip{padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;color:#59636b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.privacy{margin:0 26px 24px;padding:12px 14px;border:1px solid #ecdce2;border-radius:13px;background:#fffafd;color:#6b5660;font-size:12px;line-height:1.5}.hidden{display:none!important}#qrScratch{position:fixed;left:-10000px;top:-10000px}.closed{padding:28px;text-align:center}.closed h2{margin:0 0 8px}.closed p{color:var(--muted);margin:0}
@media(max-width:650px){body{padding:14px 10px 30px}.hero{padding:21px 18px 15px}.hero h1{font-size:23px}.lookup{grid-template-columns:1fr;padding:18px}.lookup button{width:100%}.status,.privacy{margin-left:18px;margin-right:18px}.ticket-area{padding:0 18px 20px}.ticket-wrap{padding:8px}.actions button{flex:1 1 150px}}
</style>
</head>
<body>
<div class="shell">
  <div class="brand"><img src="/logo-ui-centered.png" alt="Our Stage"><div><b>OUR STAGE</b><small>Ticket Studio • Nhận vé sự kiện</small></div></div>
  <div class="card">
    <div id="mainContent">
      <div class="hero"><div class="eyebrow">TICKET STUDIO</div><h1 id="eventTitle">Đang tải sự kiện…</h1><p>Nhập mã vé hoặc MSSV đã được Ban tổ chức cấp để tạo vé cá nhân và tải về thiết bị.</p></div>
      <div class="lookup"><input id="ticketCode" autocomplete="off" spellcheck="false" maxlength="40" placeholder="Nhập mã vé hoặc MSSV"><button id="lookupBtn">Tạo vé</button></div>
      <div id="status" class="status hidden"></div>
      <div id="ticketArea" class="ticket-area hidden">
        <div class="ticket-wrap"><canvas id="ticketCanvas"></canvas></div>
        <div id="ticketMeta" class="ticket-meta"></div>
        <div class="actions"><button id="downloadBtn">Tải vé PNG</button><button id="clearBtn" class="secondary">Nhập mã khác</button></div>
      </div>
    </div>
    <div id="closedContent" class="closed hidden"><h2>Cổng nhận vé đang đóng</h2><p>Vui lòng liên hệ Ban tổ chức nếu bạn cần hỗ trợ.</p></div>
  </div>
</div>
<div id="qrScratch"></div>
<script>
const $=s=>document.querySelector(s);let portalToken="",currentTicket=null,currentBlobUrl="",previewMode=false;const clientId=(()=>{try{let v=sessionStorage.getItem("osc_ticket_client");if(!v){const a=new Uint8Array(16);crypto.getRandomValues(a);v=Array.from(a,b=>b.toString(16).padStart(2,"0")).join("");sessionStorage.setItem("osc_ticket_client",v)}return v}catch{return String(Date.now())+Math.random().toString(36).slice(2)}})();
function hashParams(){const raw=location.hash.replace(/^#/,"");return new URLSearchParams(raw)}
function setStatus(kind,title,detail=""){const box=$("#status");box.className=`status ${kind||""}`;box.innerHTML=`<b>${escapeHtml(title)}</b>${detail?`<div style="margin-top:3px">${escapeHtml(detail)}</div>`:""}`}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function api(body){const c=new AbortController(),t=setTimeout(()=>c.abort(),16000);try{const r=await fetch("/api/ticket-studio",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:c.signal});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||`API lỗi ${r.status}`);e.code=d.code||"";throw e}return d}finally{clearTimeout(t)}}
function loadImage(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error("Không tải được mẫu vé."));i.src=src})}
function qrCanvas(value,size){return new Promise((resolve,reject)=>{const root=$("#qrScratch");root.innerHTML="";try{new QRCode(root,{text:value,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});setTimeout(()=>{const c=root.querySelector("canvas"),img=root.querySelector("img");if(c)return resolve(c);if(img){const x=document.createElement("canvas");x.width=size;x.height=size;const g=x.getContext("2d");g.drawImage(img,0,0,size,size);return resolve(x)}reject(new Error("Không tạo được QR."))},60)}catch(e){reject(e)}})}
function fitText(ctx,text,maxWidth,startSize,minSize=12){let s=startSize;while(s>minSize&&ctx.measureText(text).width>maxWidth){s-=1;ctx.font=ctx.font.replace(/\d+(?:\.\d+)?px/,`${s}px`)}return s}
function visible(box){return !box||box.visible!==false}
function drawTextBox(ctx,text,box,w,h){if(!box||box.visible===false||!String(text||"").trim())return;const x=w*box.x/100,y=h*box.y/100,bw=w*box.w/100,bh=h*box.h/100;const weight=box.fontWeight||700;let size=box.fontSize||30;ctx.save();ctx.fillStyle=box.color||"#111";ctx.textBaseline="middle";ctx.textAlign=box.align||"left";ctx.font=`${weight} ${size}px Inter, Arial, sans-serif`;size=fitText(ctx,text,bw-12,size,10);ctx.font=`${weight} ${size}px Inter, Arial, sans-serif`;let tx=x+6;if(box.align==="center")tx=x+bw/2;else if(box.align==="right")tx=x+bw-6;ctx.fillText(text,tx,y+bh/2,Math.max(10,bw-12));ctx.restore()}
function roundRectPath(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
async function renderTicket(data){const canvas=$("#ticketCanvas"),tpl=data.template,t=data.ticket;canvas.width=Math.round(tpl.width||1600);canvas.height=Math.round(tpl.height||900);const ctx=canvas.getContext("2d");const bg=await loadImage(tpl.backgroundDataUrl);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(bg,0,0,canvas.width,canvas.height);const l=tpl.layout||{};drawTextBox(ctx,t.name||"",l.name,canvas.width,canvas.height);drawTextBox(ctx,t.code||"",l.code,canvas.width,canvas.height);drawTextBox(ctx,t.mssv||"",l.mssv,canvas.width,canvas.height);drawTextBox(ctx,t.ticketType||"",l.ticketType,canvas.width,canvas.height);drawTextBox(ctx,t.seat||"",l.seat,canvas.width,canvas.height);const qb=l.qr,qx=canvas.width*qb.x/100,qy=canvas.height*qb.y/100,qw=canvas.width*qb.w/100,qh=canvas.height*qb.h/100,qs=Math.floor(Math.min(qw,qh)),qdx=qx+(qw-qs)/2,qdy=qy+(qh-qs)/2,pad=Math.max(12,Math.floor(qs*.095)),inner=Math.max(64,qs-pad*2);ctx.save();ctx.shadowColor="rgba(14,22,29,.16)";ctx.shadowBlur=Math.max(5,qs*.035);ctx.shadowOffsetY=Math.max(2,qs*.018);roundRectPath(ctx,qdx,qdy,qs,qs,Math.max(8,qs*.055));ctx.fillStyle="#fff";ctx.fill();ctx.shadowColor="transparent";ctx.lineWidth=Math.max(2,qs*.012);ctx.strokeStyle="rgba(39,49,58,.28)";ctx.stroke();ctx.restore();const qr=await qrCanvas(t.qrValue,inner);ctx.imageSmoothingEnabled=false;ctx.fillStyle="#fff";ctx.fillRect(qdx+pad-2,qdy+pad-2,inner+4,inner+4);ctx.drawImage(qr,qdx+pad,qdy+pad,inner,inner);currentTicket=data;const chips=[];if(visible(l.name)&&t.name)chips.push(`<span class="chip"><b>${escapeHtml(t.name)}</b></span>`);if(visible(l.code)&&t.code)chips.push(`<span class="chip">Mã vé: <b>${escapeHtml(t.code)}</b></span>`);if(visible(l.mssv)&&t.mssv)chips.push(`<span class="chip">MSSV: ${escapeHtml(t.mssv)}</span>`);if(visible(l.ticketType)&&t.ticketType)chips.push(`<span class="chip">Hạng vé: ${escapeHtml(t.ticketType)}</span>`);if(visible(l.seat)&&t.seat)chips.push(`<span class="chip">Ghế: ${escapeHtml(t.seat)}</span>`);$("#ticketMeta").innerHTML=chips.join("");$("#ticketArea").classList.remove("hidden")}
async function lookup(){const code=$("#ticketCode").value.trim();if(!code)return setStatus("error","Hãy nhập mã vé hoặc MSSV.");const btn=$("#lookupBtn");btn.disabled=true;setStatus("","Đang tạo vé…","Hệ thống đang xác thực mã vé và dựng QR check-in riêng.");try{const d=await api({action:"public-ticket",token:portalToken,code,clientId,preview:previewMode});await renderTicket(d);setStatus("ok","Đã tạo vé thành công","Bạn có thể tải vé xuống và dùng QR trên vé để check-in.")}catch(e){$("#ticketArea").classList.add("hidden");if(["osc/ticket-portal-closed","osc/ticket-portal-invalid"].includes(e.code))return showClosed();setStatus("error",e.message||"Không tạo được vé.",e.code==="osc/rate-limited"?"Hãy đợi vài phút rồi thử lại.":"")}finally{btn.disabled=false}}
function showClosed(){ $("#mainContent").classList.add("hidden");$("#closedContent").classList.remove("hidden") }
async function init(){const hp=hashParams();portalToken=hp.get("event")||"";previewMode=hp.get("preview")==="1";const preset=hp.get("code")||"";if(preset)$("#ticketCode").value=preset;if(!portalToken)return showClosed();try{const d=await api({action:"public-config",token:portalToken});$("#eventTitle").textContent=d.title||"Vé sự kiện";document.title=`${d.title||"Vé sự kiện"} • Our Stage`;if(!d.hasTemplate)setStatus("error","Ban tổ chức chưa hoàn tất mẫu vé.","Vui lòng quay lại sau.");else if(preset)lookup()}catch(e){showClosed()}}
$("#lookupBtn").onclick=lookup;$("#ticketCode").addEventListener("keydown",e=>{if(e.key==="Enter")lookup()});$("#clearBtn").onclick=()=>{$("#ticketArea").classList.add("hidden");$("#status").classList.add("hidden");$("#ticketCode").value="";$("#ticketCode").focus();};$("#downloadBtn").onclick=()=>{if(!currentTicket)return;const c=$("#ticketCanvas");c.toBlob(blob=>{if(!blob)return;const a=document.createElement("a");if(currentBlobUrl)URL.revokeObjectURL(currentBlobUrl);currentBlobUrl=URL.createObjectURL(blob);a.href=currentBlobUrl;a.download=`Ve_${String(currentTicket.ticket.code||"ticket").replace(/[^A-Za-z0-9_-]/g,"_")}.png`;a.click()},"image/png")};
init();
</script>
</body>
</html>
